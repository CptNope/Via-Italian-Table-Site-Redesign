<div class="cv">
  <!--
    blocks: mattone 520x110 slab, oliva 220x110, prugna 220x110, zafferano half-sun r110 rising from the band's floor, inchiostro spit bar 10 tall
    arrangement: one strip of unequal bands across the top, the sun and plate bleeding over the seams, like posters pasted edge to edge
    pattern: cut-paper half-rounds and discs (README: the sun, the plate, the spit), the shapes VIA is built from
    scales: seam (3px) between bands, radius-disc for every round, radius-square elsewhere, space-7 (48px) insets
  -->
  <svg class="band" viewBox="0 0 960 110" preserveAspectRatio="none" aria-hidden="true">
    <rect class="c-mattone" x="0" y="0" width="517" height="110"/>
    <rect class="c-oliva" x="520" y="0" width="217" height="110"/>
    <rect class="c-prugna" x="740" y="0" width="220" height="110"/>
    <path class="c-zafferano" d="M300,110 A110,110 0 0 1 520,110 Z"/>
    <circle class="c-prugna" cx="250" cy="66" r="34"/>
    <circle class="c-zafferano" cx="840" cy="55" r="34"/>
    <circle class="c-mattone" cx="880" cy="55" r="34"/>
    <rect class="c-ink" x="-20" y="54" width="640" height="10" transform="rotate(-4 300 59)"/>
  </svg>
  <div class="cv-text">
    <p class="cv-name">VIA Italian Table</p>
    <p class="cv-tag">Italian with a modern twist, pasted on Shrewsbury Street.</p>
  </div>
</div>
